[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ounmr"
version = "0.1.0"
description = "Ornstein-Uhlenbeck modeling of pulsed NMR relaxation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]